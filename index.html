<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lamplight Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A personal book tracker: your library, reading sessions, goals and stats.">
<meta name="theme-color" content="#0a1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lamplight">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>
    <div id="timer-bar" hidden></div>
    <nav id="tabbar" aria-label="Main">
      <a href="#/home" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.5h-6v5.5H5.5A1.5 1.5 0 0 1 4 19z"/></svg>
        <span>Home</span>
      </a>
      <a href="#/library" data-tab="library">
        <svg viewBox="0 0 24 24"><path d="M5 4.5h3.5v15H5zM10.5 4.5H14v15h-3.5zM16 5.6l3.2-.9 3 14.2-3.3.9z"/></svg>
        <span>Library</span>
      </a>
      <a href="#/search" data-tab="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
        <span>Search</span>
      </a>
      <a href="#/collections" data-tab="collections">
        <svg viewBox="0 0 24 24"><path d="M4.5 8.5h15v10a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5zM6.5 5.5h11M8.5 3h7"/></svg>
        <span>Collections</span>
      </a>
      <a href="#/stats" data-tab="stats">
        <svg viewBox="0 0 24 24"><path d="M5 20v-6M10 20V9M15 20v-8M20 20V4"/></svg>
        <span>Stats</span>
      </a>
      <a href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
